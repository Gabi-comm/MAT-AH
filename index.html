<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="MAT-AH: find, understand and organize your files, privately on your computer." />
    <title>MAT-AH · Found it!</title>
    <link rel="icon" href="/branding/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/branding/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/branding/app-icon-180.png" />
    <script>
      // Apply the saved theme and motion before first paint so there is no flash.
      (function () {
        var theme = "system", motion = "full", follow = true;
        try {
          var p = JSON.parse(localStorage.getItem("matah.prefs.v1") || "{}");
          if (p.theme === "light" || p.theme === "dark" || p.theme === "system") theme = p.theme;
          if (p.motion === "full" || p.motion === "subtle" || p.motion === "none") motion = p.motion;
          if (typeof p.followSystemMotion === "boolean") follow = p.followSystemMotion;
        } catch (e) {}
        var mm = window.matchMedia ? function (q) { return window.matchMedia(q).matches; } : function () { return false; };
        if (theme === "system") theme = mm("(prefers-color-scheme: dark)") ? "dark" : "light";
        if (follow && mm("(prefers-reduced-motion: reduce)")) motion = "none";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.motion = motion;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
